{% if adsense.enabled and adsense.publisher_id %}
  {# Ads are rendered only into reserved, non-game containers. #}
  {% set slot_id = adsense.slots.get(slot_name) if slot_name else None %}
  {% if slot_id %}
  <ins class="adsbygoogle"
       style="display:block;width:100%;"
       data-ad-client="{{ adsense.publisher_id }}"
       data-ad-slot="{{ slot_id }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  {% endif %}
{% endif %}
